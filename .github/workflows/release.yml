name: Release

# Publie une nouvelle version quand on pousse un tag « vX.Y.Z ».
# GitHub Actions build l'app Windows, la signe avec la clé de mise à jour,
# crée la Release et y dépose l'installeur + `latest.json` (le manifeste que
# l'app interroge pour se mettre à jour automatiquement).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # Cache des dépendances Rust pour accélérer les builds suivants.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installer les dépendances frontend
        run: npm ci

      # Extrait la section du CHANGELOG correspondant au tag (## X.Y.Z) pour
      # l'utiliser comme corps de la Release ET comme notes de mise à jour in-app.
      - name: Extraire les notes de version
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="## $VERSION" '$0==ver{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="Mise à jour de Torii $VERSION."; fi
          {
            echo "body<<__NOTES_EOF__"
            echo "$NOTES"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build, signature et dépôt des fichiers (en brouillon)
        id: publier
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clé privée de signature des mises à jour (secret du dépôt).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Torii ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          # 🔑 Brouillon d'abord. Une Release en brouillon n'est jamais « latest » :
          # tant que l'envoi des fichiers n'est pas terminé, l'updater de tout le monde
          # continue de pointer vers la version précédente, qui elle est complète.
          releaseDraft: true
          prerelease: false

      # 🔑 Le garde-fou. En 0.12.0, l'envoi des fichiers a été coupé en plein vol
      # (« other side closed ») : la Release est restée vide, elle est quand même
      # devenue « latest », et l'updater de tous les joueurs s'est mis à pointer vers
      # rien. On ne rend donc publique qu'après avoir vérifié que CHAQUE fichier
      # construit est bien arrivé — le manifeste `latest.json` compris, puisque c'est
      # lui que l'application interroge.
      - name: Vérifier que tout est arrivé, puis publier
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          id="${{ steps.publier.outputs.releaseId }}"
          if [ -z "$id" ]; then
            echo "::error::tauri-action n'a pas renvoyé d'identifiant de Release."
            exit 1
          fi

          # Ce qui a été construit ici, sur ce runner : c'est la seule référence honnête.
          find src-tauri/target/release/bundle -type f \( -name '*-setup.exe' -o -name '*.msi' -o -name '*.sig' \) -exec basename {} \; | LC_ALL=C sort -u > attendus.txt
          echo "latest.json" >> attendus.txt
          LC_ALL=C sort -u -o attendus.txt attendus.txt

          gh api "repos/${GITHUB_REPOSITORY}/releases/${id}" --jq '.assets[].name' | LC_ALL=C sort -u > presents.txt

          echo "Attendus :"; sed 's/^/  /' attendus.txt
          echo "Présents :"; sed 's/^/  /' presents.txt

          manquants=$(LC_ALL=C comm -23 attendus.txt presents.txt)
          if [ -n "$manquants" ]; then
            echo "::error::Fichiers manquants sur la Release :"
            echo "$manquants"
            echo "La Release reste EN BROUILLON : l'updater continue de servir la version"
            echo "précédente, qui est complète. Relance ce job — tauri-action réutilise"
            echo "le brouillon existant et renvoie les fichiers manquants."
            exit 1
          fi

          url=$(gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -F draft=false --jq '.html_url')
          echo "Release complète et publiée : $url"
