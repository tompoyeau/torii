name = "torii-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Domaine propre plutôt que *.workers.dev : l'adresse part codée en dur dans chaque
# version installée (et demain dans l'application mobile), donc elle doit rester à nous.
# `custom_domain` crée aussi l'enregistrement DNS au déploiement — rien à faire à la main.
# ⚠️ Un seul niveau : le certificat gratuit couvre *.topo-host.com, pas *.torii.topo-host.com.
routes = [{ pattern = "torii-api.topo-host.com", custom_domain = true }]

# Base D1 : comptes, amis, présence.
# `database_id` est renseigné par `npx wrangler d1 create torii` (voir README).
[[d1_databases]]
binding = "DB"
database_name = "torii"
database_id = "31434d10-7937-4902-a05b-96e2b2328f04"  # remplacé par 

# Bibliothèques synchronisées : un objet JSON par appareil (`lib/<compte>/<appareil>.json`).
# Elles ne sont PAS en D1 — une ligne par jeu épuiserait le quota d'écritures (cf. src/library.js).
# ⚠️ Le bucket doit rester PRIVÉ : aucun domaine public `r2.dev`, aucune règle d'accès. Le
# Worker est la seule porte, c'est lui qui vérifie le jeton, l'amitié et le partage.
[[r2_buckets]]
binding = "LIBS"
bucket_name = "torii-libraries"

# Envoi des codes de connexion. Nécessite un domaine à toi, onboardé via
# `npx wrangler email sending enable <ton-domaine>`. Tant que ce n'est pas fait,
# laisse la ligne commentée et utilise le secret DEV_CODES=1 (cf. README).
# [[send_email]]
# name = "EMAIL"

# --- Limites ------------------------------------------------------------------
#
# ⚠️ Elles exigent **wrangler 4** : wrangler 3 ignore cette section SANS RIEN DIRE et
# déploie un Worker sans aucune limite. Le Worker répond 500 « mal configuré » si les
# bindings manquent, pour que l'oubli se voie tout de suite.
#
# `period` n'accepte que 10 ou 60 (secondes), et le compteur est tenu par centre de
# données : c'est un garde-fou contre l'abus, pas une comptabilité exacte.

# Toutes les routes. Un client normal fait 2 requêtes/minute (le battement de cœur en fait
# une toutes les 30 s) : 300 laisse tout le monde tranquille et coupe le martèlement.
[[ratelimits]]
name = "RL_API"
namespace_id = "2001"
simple = { limit = 300, period = 60 }

# Envoi de codes, par IP. Les garde-fous de `login_codes` sont par ADRESSE E-MAIL : ils
# protègent la boîte de quelqu'un, pas le service — 10 000 adresses différentes les
# traversent sans en déclencher un seul. Un humain en demande un, deux s'il se trompe.
[[ratelimits]]
name = "RL_CODE"
namespace_id = "2002"
simple = { limit = 5, period = 60 }

# 🔑 Envoi de codes, pour le SERVICE ENTIER (une seule clé, « global »). C'est le seul
# rempart contre une attaque distribuée, où chaque requête vient d'une IP différente — par
# exemple une page web qui fait appeler la route par le navigateur de ses visiteurs. Sans
# lui, le compte Resend est suspendu et le domaine grillé : plus personne ne se connecte,
# y compris les comptes existants. Mieux vaut un 429 passager.
[[ratelimits]]
name = "RL_CODE_GLOBAL"
namespace_id = "2003"
simple = { limit = 20, period = 60 }

# Deux déclencheurs, deux métiers.
#
# « 17 4 * * * » — ménage nocturne : codes de connexion périmés et sessions abandonnées.
# Ce sont les deux seules tables dont la taille dépend du nombre de TENTATIVES et non du
# nombre de comptes.
#
# « 7 * * * * » — relevé du service (table `stats`). Horaire et pas quotidien : les cumuls
# se moquent de l'heure, mais la présence simultanée non. Relevée une seule fois par nuit
# elle vaudrait zéro tous les jours ; relevée toutes les heures, on obtient le vrai pic
# quotidien pour 24 écritures — contre 100 000 offertes.
#
# ⚠️ La chaîne horaire est recopiée dans `RELEVE_CRON` (src/index.js), qui s'en sert pour
# savoir s'il doit AUSSI faire le ménage. Si les deux divergent, le ménage tourne à chaque
# passage — trois `DELETE` idempotents de plus, sans conséquence. C'est le sens choisi
# exprès : reconnaître le cron du ménage aurait fait qu'une divergence l'arrête à jamais.
[triggers]
crons = ["17 4 * * *", "7 * * * *"]

# Les secrets (PEPPER, EMAIL_FROM, RESEND_API_KEY, DEV_CODES, ADMIN_TOKEN) ne sont PAS
# ici : `wrangler secret put`.
#
# ADMIN_TOKEN ouvre le panneau de suivi (`/admin`). Absent, la route se comporte comme
# une URL inconnue — fermée par défaut, jamais ouverte par défaut.
