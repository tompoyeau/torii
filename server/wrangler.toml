name = "torii-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Base D1 : comptes, amis, présence.
# `database_id` est renseigné par `npx wrangler d1 create torii` (voir README).
[[d1_databases]]
binding = "DB"
database_name = "torii"
database_id = "00000000-0000-0000-0000-000000000000"  # remplacé par 

# Envoi des codes de connexion. Nécessite un domaine à toi, onboardé via
# `npx wrangler email sending enable <ton-domaine>`. Tant que ce n'est pas fait,
# laisse la ligne commentée et utilise le secret DEV_CODES=1 (cf. README).
# [[send_email]]
# name = "EMAIL"

# Les secrets (PEPPER, EMAIL_FROM, DEV_CODES) ne sont PAS ici : `wrangler secret put`.
